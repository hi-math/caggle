<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>caggle — 어드민</title>
<link rel="stylesheet" href="pages/assets/styles.css"/>
<script>try{var h=localStorage.getItem('caggle.accentH');if(h!=null)document.documentElement.style.setProperty('--accent-h',h)}catch(e){}</script>
<style>
.admin-grid{display:grid;grid-template-columns:240px 1fr;gap:20px;align-items:start}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-sm);font-size:14px;font-weight:500;color:var(--ink-2);cursor:pointer;border:none;background:transparent;width:100%;text-align:left}
.nav-item:hover{background:var(--surface-3);color:var(--ink)}
.nav-item.active{background:var(--accent-soft-2);color:var(--accent-strong);font-weight:600}
.nav-item .ic{width:18px;height:18px;flex:none;color:inherit}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px}
.stat-card .lab{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.stat-card .val{font-family:var(--mono);font-weight:700;font-size:28px;margin-top:4px}
.tree-json{background:var(--term-bg);color:var(--term-ink);border-radius:var(--radius-sm);padding:10px 12px;font-family:var(--mono);font-size:11.5px;white-space:pre-wrap;word-break:break-all;max-height:200px;overflow-y:auto;margin-top:8px;display:none}
.expand-btn{appearance:none;border:none;background:var(--surface-3);color:var(--ink-2);font-family:var(--mono);font-size:11.5px;padding:3px 10px;border-radius:4px;cursor:pointer}
.expand-btn:hover{background:var(--accent-soft-2);color:var(--accent-strong)}
.section{display:none}
.section.active{display:block}
.sub-row td{vertical-align:top}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <a class="brand" href="simulate.html">
      <svg class="logo" viewBox="0 0 32 32" fill="none">
        <circle cx="16" cy="6" r="4" fill="var(--accent)"/>
        <circle cx="7" cy="24" r="4" fill="none" stroke="var(--ink)" stroke-width="2"/>
        <circle cx="25" cy="24" r="4" fill="none" stroke="var(--ink)" stroke-width="2"/>
        <path d="M16 10 L7 20 M16 10 L25 20" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span class="name" style="font-family:var(--mono);font-weight:700;letter-spacing:-.02em">c<b style="color:var(--accent)">a</b>ggle</span>
    </a>
    <nav class="nav">
      <a href="simulate.html">시뮬레이션</a>
      <a href="practice.html">연습</a>
      <a href="exam.html">실전</a>
      <a href="leaderboard.html">리더보드</a>
      <a href="admin.html" class="active">어드민</a>
    </nav>
    <div class="spacer"></div>
    <div id="user-chip" class="avatar" style="font-size:12px">AD</div>
  </header>

  <!-- auth gate -->
  <div id="auth-gate" style="display:none;min-height:80vh;display:grid;place-items:center">
    <div style="text-align:center;max-width:360px">
      <span class="kicker accent" style="margin-bottom:12px;display:block">어드민 전용</span>
      <h2 style="margin-bottom:20px">어드민 로그인</h2>
      <p style="color:var(--ink-2);font-size:14px;margin-bottom:20px">role=admin 계정으로 로그인하세요.<br/>(기본: admin / admin123)</p>
      <div id="gate-error" style="color:var(--accent-strong);font-size:13px;margin-bottom:12px;display:none"></div>
      <a href="login.html" class="btn btn-primary">로그인 페이지로 →</a>
    </div>
  </div>

  <!-- admin content -->
  <div id="admin-content" style="display:none">
    <main class="page wide">
      <div style="margin-bottom:24px">
        <span class="kicker accent">ADMIN DASHBOARD</span>
        <h1 style="margin-top:8px;font-size:26px">관리자 대시보드</h1>
      </div>

      <div class="admin-grid">
        <!-- sidebar nav -->
        <aside>
          <div class="card" style="padding:8px">
            <button class="nav-item active" onclick="showSection('overview',this)">
              <svg class="ic" viewBox="0 0 20 20" fill="currentColor"><path d="M2 4a2 2 0 012-2h12a2 2 0 012 2v2H2V4zm0 4h16v8a2 2 0 01-2 2H4a2 2 0 01-2-2V8z"/></svg>
              개요
            </button>
            <button class="nav-item" onclick="showSection('submissions',this)">
              <svg class="ic" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 4a1 1 0 011-1h12a1 1 0 011 1v2a1 1 0 01-1 1H4a1 1 0 01-1-1V4zm0 6a1 1 0 011-1h12a1 1 0 011 1v2a1 1 0 01-1 1H4a1 1 0 01-1-1v-2zm0 6a1 1 0 011-1h6a1 1 0 010 2H4a1 1 0 01-1-1z" clip-rule="evenodd"/></svg>
              전체 제출
            </button>
            <button class="nav-item" onclick="showSection('leaderboard',this)">
              <svg class="ic" viewBox="0 0 20 20" fill="currentColor"><path d="M9 4.804A7.968 7.968 0 005.5 4c-1.255 0-2.443.29-3.5.804v10A7.969 7.969 0 015.5 14c1.669 0 3.218.51 4.5 1.385A7.962 7.962 0 0114.5 14c1.255 0 2.443.29 3.5.804v-10A7.968 7.968 0 0014.5 4c-1.255 0-2.443.29-3.5.804V12a1 1 0 11-2 0V4.804z"/></svg>
              리더보드
            </button>
            <button class="nav-item" onclick="showSection('users',this)">
              <svg class="ic" viewBox="0 0 20 20" fill="currentColor"><path d="M9 6a3 3 0 11-6 0 3 3 0 016 0zM17 6a3 3 0 11-6 0 3 3 0 016 0zM12.93 17c.046-.327.07-.66.07-1a6.97 6.97 0 00-1.5-4.33A5 5 0 0119 16v1h-6.07zM6 11a5 5 0 015 5v1H1v-1a5 5 0 015-5z"/></svg>
              사용자
            </button>
            <hr class="hr" style="margin:8px 0"/>
            <button class="nav-item" style="color:var(--accent-strong)" onclick="downloadCSV()">
              <svg class="ic" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
              CSV 내보내기
            </button>
          </div>
        </aside>

        <!-- main content -->
        <div>
          <!-- OVERVIEW -->
          <div id="sec-overview" class="section active">
            <div class="stat-grid" id="stat-grid"></div>
            <div class="card">
              <div class="card-head"><h3>최근 제출 (10개)</h3></div>
              <table class="table">
                <thead><tr><th>사용자</th><th>모드</th><th>accuracy</th><th>노드</th><th>시각</th></tr></thead>
                <tbody id="recent-body"></tbody>
              </table>
            </div>
          </div>

          <!-- SUBMISSIONS -->
          <div id="sec-submissions" class="section">
            <div class="between" style="margin-bottom:16px">
              <h2>전체 실전 제출</h2>
              <div style="display:flex;gap:8px">
                <select id="filter-user" class="input" style="height:36px;font-size:13px" onchange="renderSubmissions()">
                  <option value="">전체 사용자</option>
                </select>
              </div>
            </div>
            <div class="card">
              <table class="table">
                <thead><tr><th>#</th><th>사용자</th><th>accuracy</th><th>macro-F1</th><th>노드</th><th>제출 시각</th><th>트리</th></tr></thead>
                <tbody id="subs-body"></tbody>
              </table>
            </div>
          </div>

          <!-- LEADERBOARD -->
          <div id="sec-leaderboard" class="section">
            <h2 style="margin-bottom:16px">리더보드 (최고 점수)</h2>
            <div class="card">
              <table class="table">
                <thead><tr><th>#</th><th>사용자</th><th>accuracy</th><th>macro-F1</th><th>노드</th><th>시각</th></tr></thead>
                <tbody id="lb-body-admin"></tbody>
              </table>
            </div>
          </div>

          <!-- USERS -->
          <div id="sec-users" class="section">
            <h2 style="margin-bottom:16px">등록 사용자</h2>
            <div class="card">
              <table class="table">
                <thead><tr><th>사용자명</th><th>역할</th><th>제출 수</th></tr></thead>
                <tbody id="users-body"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="drug_data.js"></script>
<script>
function timeAgo(ts) {
  const mins = Math.round((Date.now()-ts)/60000);
  if (mins<60) return mins+'분 전';
  if (mins<1440) return Math.round(mins/60)+'시간 전';
  return Math.round(mins/1440)+'일 전';
}

// auth check
const sess = getSession();
const isAdmin = sess && sess.role === 'admin';
if (!isAdmin) {
  document.getElementById('admin-content').style.display='none';
  document.getElementById('auth-gate').style.display='grid';
} else {
  document.getElementById('auth-gate').style.display='none';
  document.getElementById('admin-content').style.display='block';
  document.getElementById('user-chip').textContent = sess.username.slice(0,2).toUpperCase();
  initAdmin();
}

function showSection(id, btn) {
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
  document.getElementById('sec-'+id).classList.add('active');
  btn.classList.add('active');
  renderSection(id);
}

function renderSection(id) {
  if (id==='overview') renderOverview();
  else if (id==='submissions') renderSubmissions();
  else if (id==='leaderboard') renderLbAdmin();
  else if (id==='users') renderUsers();
}

function initAdmin() { renderOverview(); }

function renderOverview() {
  const subs = getAllSubmissions();
  const lb = getLBEntries();
  const users = Object.keys(getUsersMap());
  const finalSubs = subs.filter(s=>s.mode==='final');

  document.getElementById('stat-grid').innerHTML = [
    { lab:'등록 사용자', val: users.length },
    { lab:'전체 실전 제출', val: finalSubs.length },
    { lab:'리더보드 참가', val: lb.length },
    { lab:'최고 accuracy', val: lb.length ? (lb[0].accuracy*100).toFixed(1)+'%' : '–' },
  ].map(s=>`<div class="stat-card"><div class="lab">${s.lab}</div><div class="val">${s.val}</div></div>`).join('');

  document.getElementById('recent-body').innerHTML = subs.slice(0,10).map(s=>
    `<tr>
      <td>${s.username}</td>
      <td><span class="tag ${s.mode==='final'?'accent':''}">${s.mode==='final'?'실전':'연습'}</span></td>
      <td class="num" style="font-weight:700">${(s.accuracy*100).toFixed(1)}%</td>
      <td class="num">${s.nodeCount}</td>
      <td class="num muted3" style="font-size:12px">${timeAgo(s.submittedAt)}</td>
    </tr>`
  ).join('') || '<tr><td colspan="5" class="muted3" style="text-align:center;padding:20px">제출 없음</td></tr>';
}

function getUsersMap() {
  try { return JSON.parse(localStorage.getItem('caggle.users')||'{}'); } catch { return {}; }
}

function renderSubmissions() {
  const subs = getAllSubmissions().filter(s=>s.mode==='final');
  const filterUser = document.getElementById('filter-user').value;

  // populate filter
  const users = [...new Set(subs.map(s=>s.username))];
  const sel = document.getElementById('filter-user');
  const current = sel.value;
  sel.innerHTML = '<option value="">전체 사용자</option>' + users.map(u=>`<option${u===current?' selected':''}>${u}</option>`).join('');

  const filtered = filterUser ? subs.filter(s=>s.username===filterUser) : subs;

  document.getElementById('subs-body').innerHTML = filtered.map((s,i)=>
    `<tr class="sub-row">
      <td class="num">${i+1}</td>
      <td>${s.username}</td>
      <td class="num" style="font-weight:700;color:var(--accent-strong)">${(s.accuracy*100).toFixed(1)}%</td>
      <td class="num">${s.macroF1.toFixed(4)}</td>
      <td class="num">${s.nodeCount}</td>
      <td class="num muted3" style="font-size:12px">${timeAgo(s.submittedAt)}</td>
      <td>
        <button class="expand-btn" onclick="toggleJson(this)">트리 보기</button>
        <div class="tree-json">${escHtml(JSON.stringify(JSON.parse(s.treeJson||'null'),null,2))}</div>
      </td>
    </tr>`
  ).join('') || '<tr><td colspan="7" class="muted3" style="text-align:center;padding:20px">제출 없음</td></tr>';
}

function renderLbAdmin() {
  const lb = getLBEntries();
  document.getElementById('lb-body-admin').innerHTML = lb.map((e,i)=>
    `<tr>
      <td class="num">${i+1}</td>
      <td style="font-weight:600">${e.username}</td>
      <td class="num" style="font-weight:700;font-size:15px;${i===0?'color:var(--accent-strong)':''}">${(e.accuracy*100).toFixed(1)}%</td>
      <td class="num">${e.macroF1.toFixed(4)}</td>
      <td class="num">${e.nodeCount}</td>
      <td class="num muted3" style="font-size:12px">${timeAgo(e.submittedAt)}</td>
    </tr>`
  ).join('') || '<tr><td colspan="6" class="muted3" style="text-align:center;padding:20px">없음</td></tr>';
}

function renderUsers() {
  const usersMap = getUsersMap();
  const subs = getAllSubmissions();
  const subCount = {};
  subs.filter(s=>s.mode==='final').forEach(s=>{ subCount[s.username]=(subCount[s.username]||0)+1; });

  document.getElementById('users-body').innerHTML = Object.entries(usersMap).map(([u,info])=>
    `<tr>
      <td style="font-weight:600;font-family:var(--mono)">${u}</td>
      <td><span class="tag ${info.role==='admin'?'accent':''}">${info.role}</span></td>
      <td class="num">${subCount[u]||0}</td>
    </tr>`
  ).join('') || '<tr><td colspan="3" class="muted3" style="text-align:center;padding:20px">없음</td></tr>';
}

function toggleJson(btn) {
  const el = btn.nextElementSibling;
  const open = el.style.display === 'block';
  el.style.display = open ? 'none' : 'block';
  btn.textContent = open ? '트리 보기' : '접기';
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function downloadCSV() {
  const subs = getAllSubmissions().filter(s=>s.mode==='final');
  if (!subs.length) { alert('내보낼 데이터가 없습니다.'); return; }
  const rows = [['username','accuracy','macroF1','nodeCount','submittedAt']];
  subs.forEach(s=>rows.push([s.username,(s.accuracy*100).toFixed(2),s.macroF1.toFixed(4),s.nodeCount,new Date(s.submittedAt).toISOString()]));
  const csv = rows.map(r=>r.join(',')).join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download = 'caggle_submissions.csv';
  a.click();
}
</script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script type="text/babel" src="pages/assets/tweaks-panel.jsx"></script>
<script type="text/babel" src="pages/assets/accent-tweak.jsx"></script>
</body>
</html>
