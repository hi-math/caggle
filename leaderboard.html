<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>caggle — 리더보드</title>
<link rel="stylesheet" href="pages/assets/styles.css"/>
<script>try{var h=localStorage.getItem('caggle.accentH');if(h!=null)document.documentElement.style.setProperty('--accent-h',h)}catch(e){}</script>
<style>
.lb-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.lb-head h1{font-size:28px;letter-spacing:-.02em}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}
.pod{position:relative;padding:20px;overflow:hidden}
.pod.first{border-color:var(--accent-border);box-shadow:0 0 0 1px var(--accent-border),var(--shadow)}
.pod .rk{position:absolute;right:16px;top:14px;font-family:var(--mono);font-size:46px;font-weight:700;color:var(--surface-3);line-height:1}
.pod .team{display:flex;align-items:center;gap:10px}
.pod .ava{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:14px}
.pod .name{font-weight:600;font-size:15px}
.pod .who{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.pod .score{font-family:var(--mono);font-weight:700;font-size:30px;margin-top:16px;letter-spacing:-.02em}
.pod .lab{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.lb-grid{display:grid;grid-template-columns:1fr 312px;gap:20px;align-items:start}
.you-row td{background:var(--accent-soft)}
.you-row:hover td{background:var(--accent-soft)}
.chg{font-family:var(--mono);font-size:12px;display:inline-flex;align-items:center;gap:3px}
.tname{display:flex;align-items:center;gap:11px}
.tname .ava{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:12px;flex:none}
.side-stat{display:flex;justify-content:space-between;padding:7px 0;font-size:13.5px;border-bottom:1px solid var(--border)}
.side-stat:last-child{border-bottom:none}
.empty-state{text-align:center;padding:48px 24px;color:var(--ink-3)}
.empty-state h3{font-size:18px;margin-bottom:8px;color:var(--ink-2)}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <a class="brand" href="simulate.html">
      <svg class="logo" viewBox="0 0 32 32" fill="none">
        <circle cx="16" cy="6" r="4" fill="var(--accent)"/>
        <circle cx="7" cy="24" r="4" fill="none" stroke="var(--ink)" stroke-width="2"/>
        <circle cx="25" cy="24" r="4" fill="none" stroke="var(--ink)" stroke-width="2"/>
        <path d="M16 10 L7 20 M16 10 L25 20" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span class="name" style="font-family:var(--mono);font-weight:700;letter-spacing:-.02em">c<b style="color:var(--accent)">a</b>ggle</span>
    </a>
    <nav class="nav">
      <a href="simulate.html">시뮬레이션</a>
      <a href="practice.html">연습</a>
      <a href="exam.html">실전</a>
      <a href="leaderboard.html" class="active">리더보드</a>
    </nav>
    <div class="spacer"></div>
    <div id="user-chip" class="avatar" style="font-size:12px">--</div>
  </header>

  <main class="page wide">
    <div class="lb-head">
      <div>
        <span class="kicker accent">Drug 처방 예측 챌린지</span>
        <h1 style="margin-top:8px">리더보드</h1>
        <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap" id="lb-meta"></div>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="location.reload()">새로고침</button>
    </div>

    <!-- podium -->
    <div class="podium" id="podium"></div>

    <div class="lb-grid">
      <!-- TABLE -->
      <div class="card" id="table-card">
        <div id="empty-state" class="empty-state" style="display:none">
          <h3>아직 제출이 없습니다</h3>
          <p style="font-size:14px">실전 페이지에서 트리를 제출하면 여기에 표시됩니다.</p>
          <a href="exam.html" class="btn btn-primary" style="margin-top:16px">실전 도전 →</a>
        </div>
        <table class="table" id="lb-table">
          <thead><tr>
            <th style="width:54px">#</th>
            <th>사용자</th>
            <th style="width:110px">accuracy</th>
            <th style="width:110px">macro-F1</th>
            <th style="width:80px">노드 수</th>
            <th style="width:120px">제출 시각</th>
          </tr></thead>
          <tbody id="lb-body"></tbody>
        </table>
      </div>

      <!-- sidebar -->
      <aside style="display:flex;flex-direction:column;gap:18px">
        <div id="my-rank-card" class="card card-pad" style="border-color:var(--accent-border);display:none">
          <span class="kicker accent">내 순위</span>
          <div style="display:flex;align-items:baseline;gap:8px;margin:8px 0 4px">
            <span class="mono" style="font-size:32px;font-weight:700" id="my-rank">#–</span>
          </div>
          <div class="muted" style="font-size:13px" id="my-pct"></div>
          <hr class="hr" style="margin:12px 0"/>
          <div class="side-stat"><span class="muted">내 최고 점수</span><b class="mono" id="my-score" style="color:var(--accent-strong)">–</b></div>
          <div class="side-stat"><span class="muted">1위까지</span><b class="mono" id="my-gap">–</b></div>
          <a class="btn btn-primary btn-block btn-sm" href="exam.html" style="margin-top:14px">작업 스페이스로 →</a>
        </div>

        <div class="card card-pad">
          <span class="kicker" style="margin-bottom:10px">규칙</span>
          <ul style="margin:0;padding-left:16px;font-size:13px;color:var(--ink-2);line-height:1.8">
            <li>실전셋 100행 기준 accuracy</li>
            <li>동점 시 노드 수 적은 순</li>
            <li>사용자당 최고 점수 1행</li>
            <li>최대 3회 제출</li>
          </ul>
        </div>
      </aside>
    </div>
  </main>
</div>

<script src="drug_data.js"></script>
<script>
const sess = requireLogin('leaderboard.html');
if (sess) document.getElementById('user-chip').textContent = sess.username.slice(0,2).toUpperCase();

const HUES = [25, 150, 250, 80, 300];
const MEDAL = ['g','s','b'];

function timeAgo(ts) {
  const mins = Math.round((Date.now()-ts)/60000);
  if (mins < 60) return mins+'분 전';
  if (mins < 1440) return Math.round(mins/60)+'시간 전';
  return Math.round(mins/1440)+'일 전';
}

function render() {
  const entries = getLBEntries();
  const total = entries.length;

  // meta
  document.getElementById('lb-meta').innerHTML =
    `<span class="tag">${total}명 참가</span>` +
    (total ? `<span class="tag">1위 accuracy <b style="color:var(--accent-strong)">${(entries[0].accuracy*100).toFixed(1)}%</b></span>` : '');

  if (!total) {
    document.getElementById('empty-state').style.display='';
    document.getElementById('lb-table').style.display='none';
    document.getElementById('podium').innerHTML='';
    return;
  }

  document.getElementById('empty-state').style.display='none';
  document.getElementById('lb-table').style.display='';

  // podium
  const podHTML = entries.slice(0,3).map((e,i) => {
    const medalCls = MEDAL[i] || '';
    const ava = i < 3
      ? `<div class="ava medal ${medalCls}">${e.username.slice(0,2).toUpperCase()}</div>`
      : `<div class="ava" style="background:oklch(0.95 0.045 ${HUES[i%HUES.length]});color:var(--ink)">${e.username.slice(0,2).toUpperCase()}</div>`;
    const isYou = sess && e.username === sess.username;
    return `<div class="card pod ${i===0?'first':''}">
      <div class="rk">${i+1}</div>
      <div class="team">${ava}<div>
        <div class="name">${e.username}${isYou?' <span class="tag accent" style="height:16px;font-size:10px">나</span>':''}</div>
        <div class="who">노드 ${e.nodeCount}개</div>
      </div></div>
      <div class="lab" style="margin-top:14px">accuracy</div>
      <div class="score" style="${i===0?'color:var(--accent-strong)':''}">${(e.accuracy*100).toFixed(1)}%</div>
    </div>`;
  }).join('');
  // fill empty pods
  const fill = 3 - Math.min(3, entries.length);
  document.getElementById('podium').innerHTML = podHTML + Array(fill).fill('<div class="card pod" style="opacity:.35"><div class="rk">–</div><div class="team"><div class="ava" style="background:var(--surface-3)">?</div><div><div class="name">미제출</div></div></div></div>').join('');

  // table
  const tbody = document.getElementById('lb-body');
  tbody.innerHTML = entries.map((e,i) => {
    const rank = i+1;
    const isYou = sess && e.username === sess.username;
    const medalCls = rank<=3 ? `medal ${MEDAL[rank-1]}` : '';
    const avaStyle = rank<=3 ? '' : `style="background:oklch(0.95 0.045 ${HUES[i%HUES.length]});color:var(--ink);border:1px solid oklch(0.85 0.08 ${HUES[i%HUES.length]})"`;
    return `<tr class="${isYou?'you-row':''}">
      <td><span class="rank">${rank}</span></td>
      <td>
        <div class="tname">
          <div class="ava ${medalCls}" ${!medalCls?avaStyle:''}>${e.username.slice(0,2).toUpperCase()}</div>
          <div>
            <div style="font-weight:${isYou?700:600}">${e.username}${isYou?' <span class="tag accent" style="height:16px;font-size:10px">나</span>':''}</div>
          </div>
        </div>
      </td>
      <td><span class="num" style="font-weight:700;font-size:15px;${isYou?'color:var(--accent-strong)':''}">${(e.accuracy*100).toFixed(1)}%</span></td>
      <td><span class="num">${e.macroF1.toFixed(4)}</span></td>
      <td><span class="num muted">${e.nodeCount}</span></td>
      <td><span class="num muted3" style="font-size:12px">${timeAgo(e.submittedAt)}</span></td>
    </tr>`;
  }).join('');

  // my rank card
  if (sess) {
    const myIdx = entries.findIndex(e=>e.username===sess.username);
    if (myIdx >= 0) {
      const me = entries[myIdx];
      const myRank = myIdx+1;
      document.getElementById('my-rank-card').style.display='';
      document.getElementById('my-rank').textContent = '#'+myRank;
      document.getElementById('my-pct').textContent = '상위 '+((myRank/total)*100).toFixed(1)+'%';
      document.getElementById('my-score').textContent = (me.accuracy*100).toFixed(1)+'%';
      document.getElementById('my-gap').textContent = myIdx===0 ? '–' : '-'+(entries[0].accuracy-me.accuracy).toFixed(4);
    }
  }
}

render();
</script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script type="text/babel" src="pages/assets/tweaks-panel.jsx"></script>
<script type="text/babel" src="pages/assets/accent-tweak.jsx"></script>
</body>
</html>
